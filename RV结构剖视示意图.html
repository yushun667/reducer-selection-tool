<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>RV 减速器结构剖视示意图</title>
<style>
  body { background:#1e2430; color:#dde3ea; font-family:-apple-system,"PingFang SC",sans-serif;
         margin:0; padding:20px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:#8b98a8; font-size:12.5px; margin-bottom:8px; }
</style>
</head>
<body>
<h1>RV 减速器（2K-V 型）轴向剖视结构示意图 · 按选型工具当前参数（i = 1+(46/26)×48 = 85.9）</h1>
<div class="sub">示意画法：轴向拉长、偏心距夸大，零件轴向叠放关系与真机一致。颜色与三维模型、二维动画一致。</div>
<svg width="1360" height="900" viewBox="0 0 1360 900" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0,0 L8,4.5 L0,9 z" fill="#ffd166"/>
  </marker>
  <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0,0 L8,4.5 L0,9 z" fill="#7cc4ff"/>
  </marker>
</defs>

<!-- ================= 针齿壳（固定） ================= -->
<rect x="180" y="140" width="560" height="32" fill="#5d6d7e" stroke="#dfe7ee" stroke-width="1.5"/>
<rect x="180" y="658" width="560" height="32" fill="#5d6d7e" stroke="#dfe7ee" stroke-width="1.5"/>
<rect x="180" y="140" width="22" height="550" fill="#5d6d7e" stroke="#dfe7ee" stroke-width="1.5"/>
<rect x="718" y="140" width="22" height="550" fill="#5d6d7e" stroke="#dfe7ee" stroke-width="1.5"/>

<!-- ================= 主轴承 ×2（壳体 ↔ 行星架盘） ================= -->
<rect x="300" y="146" width="28" height="30" fill="#3fae7a" stroke="#bfe9d4" stroke-width="1"/>
<rect x="300" y="654" width="28" height="30" fill="#3fae7a" stroke="#bfe9d4" stroke-width="1"/>
<rect x="596" y="146" width="28" height="30" fill="#3fae7a" stroke="#bfe9d4" stroke-width="1"/>
<rect x="596" y="654" width="28" height="30" fill="#3fae7a" stroke="#bfe9d4" stroke-width="1"/>

<!-- ================= 针齿 ×48（剖面上下各见一排） ================= -->
<g fill="#c9a227" stroke="#e8d06a" stroke-width="1">
  <circle cx="415" cy="193" r="12"/><circle cx="455" cy="193" r="12"/><circle cx="495" cy="193" r="12"/>
  <circle cx="535" cy="193" r="12"/><circle cx="575" cy="193" r="12"/>
  <circle cx="415" cy="637" r="12"/><circle cx="455" cy="637" r="12"/><circle cx="495" cy="637" r="12"/>
  <circle cx="535" cy="637" r="12"/><circle cx="575" cy="637" r="12"/>
</g>

<!-- ================= 摆线轮 A（上偏）/ B（下偏，180° 错相） ================= -->
<rect x="392" y="199" width="60" height="416" fill="#8a94a0" stroke="#dfe7ee" stroke-width="1.5"/>
<rect x="478" y="231" width="60" height="416" fill="#7d8794" stroke="#dfe7ee" stroke-width="1.5"/>
<!-- 摆线轮曲轴孔（轴承外圈） -->
<circle cx="422" cy="290" r="18" fill="#141a23" stroke="#9fb0c0" stroke-width="1"/>
<circle cx="508" cy="334" r="18" fill="#141a23" stroke="#9fb0c0" stroke-width="1"/>
<!-- 连接柱让位孔 -->
<circle cx="422" cy="251" r="15" fill="#141a23" stroke="#4a7ebb" stroke-width="1.2" stroke-dasharray="4,3"/>
<circle cx="508" cy="251" r="15" fill="#141a23" stroke="#4a7ebb" stroke-width="1.2" stroke-dasharray="4,3"/>
<circle cx="422" cy="579" r="15" fill="#141a23" stroke="#4a7ebb" stroke-width="1.2" stroke-dasharray="4,3"/>
<circle cx="508" cy="579" r="15" fill="#141a23" stroke="#4a7ebb" stroke-width="1.2" stroke-dasharray="4,3"/>

<!-- ================= 行星架（输出件） ================= -->
<!-- 盘1（左）：曲轴孔 + 输入轴中心孔 -->
<rect x="296" y="176" width="36" height="121" fill="#4a7ebb" stroke="#bcd6f5" stroke-width="1.5"/>
<rect x="296" y="327" width="36" height="77" fill="#4a7ebb" stroke="#bcd6f5" stroke-width="1.5"/>
<rect x="296" y="436" width="36" height="218" fill="#4a7ebb" stroke="#bcd6f5" stroke-width="1.5"/>
<!-- 盘2（右）：曲轴孔 -->
<rect x="592" y="176" width="36" height="121" fill="#4a7ebb" stroke="#bcd6f5" stroke-width="1.5"/>
<rect x="592" y="327" width="36" height="327" fill="#4a7ebb" stroke="#bcd6f5" stroke-width="1.5"/>
<!-- 连接柱（穿过摆线轮让位孔） -->
<rect x="332" y="240" width="260" height="22" fill="none" stroke="#4a7ebb" stroke-width="2.5" stroke-dasharray="8,5"/>
<rect x="332" y="568" width="260" height="22" fill="none" stroke="#4a7ebb" stroke-width="2.5" stroke-dasharray="8,5"/>
<!-- 输出法兰 + 轮毂 -->
<rect x="628" y="270" width="78" height="290" fill="#4a7ebb" stroke="#bcd6f5" stroke-width="1.5"/>
<rect x="706" y="350" width="28" height="130" fill="#3d6aa3" stroke="#bcd6f5" stroke-width="1.5"/>

<!-- ================= 输入轴 + 太阳轮 ================= -->
<rect x="30" y="406" width="300" height="28" fill="#9fb0c0" stroke="#dfe7ee" stroke-width="1.2"/>
<rect x="206" y="372" width="46" height="96" fill="#6d7d8e" stroke="#dfe7ee" stroke-width="1.5"/>

<!-- ================= 行星轮（剖到上方 1 个，与太阳轮啮合） ================= -->
<rect x="206" y="252" width="46" height="120" fill="#4e6d5e" stroke="#dfe7ee" stroke-width="1.5"/>
<path d="M206,372 l6,9 6,-9 6,9 6,-9 6,9 6,-9 6,9 5,7" fill="none" stroke="#dfe7ee" stroke-width="1.4"/>

<!-- ================= 曲轴（=行星轮轴，红） ================= -->
<rect x="206" y="303" width="190" height="18" fill="#e06c5b" stroke="#f3b3a8" stroke-width="1"/>
<rect x="452" y="303" width="26" height="18" fill="#e06c5b" stroke="#f3b3a8" stroke-width="1"/>
<rect x="534" y="303" width="138" height="18" fill="#e06c5b" stroke="#f3b3a8" stroke-width="1"/>
<!-- 偏心段 A（上偏 e，夸大） -->
<rect x="396" y="281" width="56" height="18" fill="#e06c5b" stroke="#f3b3a8" stroke-width="1.4"/>
<!-- 偏心段 B（下偏 e，180° 错相） -->
<rect x="478" y="325" width="56" height="18" fill="#e06c5b" stroke="#f3b3a8" stroke-width="1.4"/>
<!-- 曲轴主轴线（虚线，显示偏心） -->
<line x1="206" y1="312" x2="672" y2="312" stroke="#ffd166" stroke-width="1" stroke-dasharray="5,4"/>

<!-- 曲轴轴承（行星架支承 ×2/根） -->
<rect x="300" y="294" width="28" height="8" fill="#3fae7a"/>
<rect x="300" y="322" width="28" height="8" fill="#3fae7a"/>
<rect x="596" y="294" width="28" height="8" fill="#3fae7a"/>
<rect x="596" y="322" width="28" height="8" fill="#3fae7a"/>

<!-- ================= 主中心线 ================= -->
<line x1="20" y1="420" x2="780" y2="420" stroke="#ffd166" stroke-width="1.2" stroke-dasharray="14,5,3,5"/>

<!-- ================= 运动箭头 ================= -->
<path d="M66,376 A26,26 0 1 1 94,388" fill="none" stroke="#ffd166" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="30" y="362" fill="#ffd166" font-size="14" font-family="-apple-system,'PingFang SC',sans-serif">输入 504 rpm</text>
<path d="M784,300 A30,30 0 1 0 752,314" fill="none" stroke="#7cc4ff" stroke-width="2.5" marker-end="url(#arB)"/>
<text x="752" y="286" fill="#7cc4ff" font-size="14" font-family="-apple-system,'PingFang SC',sans-serif">输出 5.9 rpm · 15 N·m</text>

<!-- ================= 标注 ================= -->
<g font-size="13.5" fill="#dde3ea" font-family="-apple-system,'PingFang SC',sans-serif">
  <!-- 上排 -->
  <line x1="229" y1="252" x2="229" y2="92" stroke="#8b98a8" stroke-width="1"/>
  <text x="120" y="84">行星轮 z=46 ×3（剖到 1 个）</text>
  <line x1="314" y1="146" x2="352" y2="62" stroke="#8b98a8" stroke-width="1"/>
  <text x="336" y="54" fill="#3fae7a">主轴承 ×2</text>
  <line x1="424" y1="281" x2="424" y2="92" stroke="#8b98a8" stroke-width="1"/>
  <text x="368" y="84" fill="#e06c5b">偏心段 A（e=0.25 ↑）</text>
  <line x1="535" y1="181" x2="560" y2="118" stroke="#8b98a8" stroke-width="1"/>
  <text x="480" y="110" fill="#c9a227">针齿 ×48（固定在壳体）</text>
  <line x1="729" y1="140" x2="790" y2="92" stroke="#8b98a8" stroke-width="1"/>
  <text x="700" y="84">针齿壳（固定，Ø51）</text>
  <!-- 下排 -->
  <line x1="150" y1="434" x2="110" y2="712" stroke="#8b98a8" stroke-width="1"/>
  <text x="30" y="730">输入轴（电机轴）Ø6</text>
  <line x1="229" y1="468" x2="229" y2="742" stroke="#8b98a8" stroke-width="1"/>
  <text x="150" y="760">太阳轮 z=26（与输入轴一体）</text>
  <line x1="422" y1="615" x2="380" y2="712" stroke="#8b98a8" stroke-width="1"/>
  <text x="290" y="730" fill="#8a94a0">摆线轮 A（z_c=47）</text>
  <line x1="508" y1="647" x2="508" y2="742" stroke="#8b98a8" stroke-width="1"/>
  <text x="440" y="760" fill="#7d8794">摆线轮 B（180° 错相）</text>
  <line x1="660" y1="321" x2="700" y2="712" stroke="#8b98a8" stroke-width="1"/>
  <text x="612" y="730" fill="#e06c5b">曲轴（=行星轮轴）×3 · 偏心段 B（↓）</text>
  <line x1="667" y1="560" x2="780" y2="742" stroke="#8b98a8" stroke-width="1"/>
  <text x="700" y="760" fill="#4a7ebb">行星架：盘×2 + 连接柱 + 输出法兰（= 输出件）</text>
</g>

<!-- ================= 右侧图例 ================= -->
<g font-size="13" fill="#c4cfdb" font-family="-apple-system,'PingFang SC',sans-serif">
  <rect x="800" y="140" width="300" height="218" fill="#232c3a" rx="8"/>
  <text x="816" y="164" fill="#7cc4ff" font-size="13.5">图例（颜色与三维模型一致）</text>
  <rect x="816" y="178" width="16" height="12" fill="#9fb0c0"/><text x="840" y="188">输入轴 + 太阳轮（输入）</text>
  <rect x="816" y="198" width="16" height="12" fill="#4e6d5e"/><text x="840" y="208">行星轮 ×3</text>
  <rect x="816" y="218" width="16" height="12" fill="#e06c5b"/><text x="840" y="228">曲轴 ×3（= 行星轮轴）</text>
  <rect x="816" y="238" width="16" height="12" fill="#8a94a0"/><text x="840" y="248">摆线轮 ×2（180° 错相）</text>
  <rect x="816" y="258" width="16" height="12" fill="#c9a227"/><text x="840" y="268">针齿 ×48（固定）</text>
  <rect x="816" y="278" width="16" height="12" fill="#5d6d7e"/><text x="840" y="288">针齿壳（固定）</text>
  <rect x="816" y="298" width="16" height="12" fill="#4a7ebb"/><text x="840" y="308">行星架（输出）</text>
  <rect x="816" y="318" width="16" height="12" fill="#3fae7a"/><text x="840" y="328">轴承（主轴承 / 曲轴轴承）</text>
</g>

<!-- ================= 底部说明 ================= -->
<g font-size="13" fill="#c4cfdb" font-family="-apple-system,'PingFang SC',sans-serif">
  <rect x="20" y="792" width="1320" height="96" fill="#232c3a" rx="8"/>
  <text x="36" y="816" fill="#8ef0c1" font-size="13.5">运动链：① 输入轴带太阳轮（26齿）转 → ② 行星轮（46齿）被迫自转，行星轮压在曲轴上 → ③ 曲轴偏心段逼摆线轮摆动，摆线轮被固定针齿顶住，反作用力推曲轴绕主轴线公转 → ④ 曲轴公转 = 行星架旋转 = 输出</text>
  <text x="36" y="842">速比是差动关系：<tspan fill="#ffd166">i = 1 + (z_p/z_s)·(z_c+1) = 1 + (46/26)×48 = 85.9</tspan>　（不是两级相乘；没有内齿圈、没有输出柱销盘——摆线轮的转动由曲轴-行星架闭环约束）</text>
  <text x="36" y="868" fill="#8b98a8">固定件：针齿壳（含针齿）　·　输入：输入轴/太阳轮（504 rpm）　·　输出：行星架（5.9 rpm · 15 N·m）　·　摆线级承受几乎全部输出扭矩、约半数针齿同时承载 → RV 刚度高的根本原因</text>
</g>
</svg>
</body>
</html>
